<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" role="img" aria-label="Une conseillère et un étudiant préparent un dossier sur un ordinateur">
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.e2{animation-delay:1.9s}
.spin{transform-origin:342px 118px;animation:rock 6s ease-in-out infinite}
.line{animation:pulse 2.4s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Conseillère -->
  <path d="M36 164q0-58 42-58t42 58z" fill="#102756"/>
  <path d="M66 108l12 22 12-22z" fill="#fff"/>
  <path d="M112 130l44 18" stroke="#102756" stroke-width="15"/>
  <circle cx="160" cy="150" r="8" fill="#6b3f2a"/>
  <rect x="70" y="84" width="16" height="24" rx="6" fill="#5a3322"/>
  <circle cx="78" cy="26" r="17" fill="#1b1411"/>
  <path d="M52 62q-2-28 26-28t26 28" fill="#1b1411"/>
  <ellipse cx="80" cy="66" rx="21" ry="24" fill="#6b3f2a"/>
  <g class="eyes" fill="#1b1411"><circle cx="77" cy="65" r="2.600"/><circle cx="92" cy="65" r="2.600"/></g>
  <path d="M77 78q8 6 15 0" stroke="#1b1411" stroke-width="2.200"/>

  <!-- Étudiant -->
  <path d="M212 164q0-58 42-58t42 58z" fill="#f6cd39"/>
  <path d="M220 132l-20 16" stroke="#f6cd39" stroke-width="15"/>
  <circle cx="196" cy="151" r="8" fill="#8a5a3c"/>
  <rect x="246" y="84" width="16" height="24" rx="6" fill="#744a30"/>
  <ellipse cx="252" cy="66" rx="21" ry="24" fill="#8a5a3c"/>
  <path d="M231 60q0-22 21-22t21 22q-9-10-21-10t-21 10z" fill="#1b1411"/>
  <g class="eyes e2" fill="#1b1411"><circle cx="239" cy="66" r="2.600"/><circle cx="254" cy="66" r="2.600"/></g>
  <path d="M239 79q7 6 15 0" stroke="#1b1411" stroke-width="2.200"/>

  <!-- Table, ordinateur, globe -->
  <rect x="10" y="158" width="380" height="14" rx="4" fill="#132642"/>
  <path d="M40 172v42M360 172v42" stroke="#132642" stroke-width="10"/>
  <rect x="136" y="96" width="74" height="52" rx="5" fill="#132642"/>
  <rect x="141" y="101" width="64" height="42" rx="2" fill="#f1f5fd"/>
  <path class="line" d="M149 112h48" stroke="#173ad3" stroke-width="4"/>
  <path d="M149 122h34M149 132h42" stroke="#829acb" stroke-width="4"/>
  <path d="M124 148h98" stroke="#829acb" stroke-width="8"/>
  <g class="spin">
    <circle cx="342" cy="118" r="26" fill="#4aa9e4"/>
    <path d="M326 108q12-8 18 2t-6 12q-8 2-12-14zM346 124q10-6 16 0t-8 14q-10 0-8-14z" fill="#fff"/>
  </g>
  <path d="M342 144v12M326 157h32" stroke="#102756" stroke-width="5"/>
</g>
</svg>
