<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" role="img" aria-label="Une étudiante en entretien avec un agent consulaire">
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.e2{animation-delay:2s}
.b1{animation:talk 6s infinite}.b2{animation:talk 6s 3s infinite;opacity:0}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{0%,8%{opacity:0}14%,44%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.b2{opacity:1}}
</style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Agent -->
  <path d="M232 158q0-52 40-52t40 52z" fill="#102756"/>
  <path d="M260 106l12 26 12-26z" fill="#fff"/>
  <path d="M272 112l-5 7 5 21 5-21z" fill="#173ad3"/>
  <rect x="264" y="84" width="16" height="24" rx="6" fill="#4a2a1c"/>
  <ellipse cx="272" cy="66" rx="22" ry="25" fill="#5a3322"/>
  <path d="M250 60q0-20 22-20t22 20q-9-9-22-9t-22 9z" fill="#1b1411"/>
  <g class="eyes" fill="#1b1411"><circle cx="260" cy="67" r="2.600"/><circle cx="275" cy="67" r="2.600"/></g>
  <path d="M260 79q6 4 12 0" stroke="#1b1411" stroke-width="2.200"/>

  <!-- Étudiante -->
  <rect x="42" y="96" width="76" height="66" rx="14" fill="#dfe5ef"/>
  <path d="M50 164q0-50 36-50t36 50z" fill="#173ad3"/>
  <path d="M116 134l26 20" stroke="#173ad3" stroke-width="14"/>
  <rect x="78" y="92" width="16" height="24" rx="6" fill="#6b3f2a"/>
  <circle cx="86" cy="68" r="31" fill="#1b1411"/>
  <ellipse cx="88" cy="76" rx="20" ry="23" fill="#7a4a30"/>
  <g class="eyes e2" fill="#1b1411"><circle cx="85" cy="75" r="2.500"/><circle cx="100" cy="75" r="2.500"/></g>
  <path d="M86 87q7 5 14 0" stroke="#1b1411" stroke-width="2.200"/>

  <!-- Bureau -->
  <rect x="12" y="158" width="336" height="14" rx="4" fill="#132642"/>
  <path d="M36 172v42M324 172v42" stroke="#132642" stroke-width="10"/>
  <rect x="130" y="148" width="52" height="10" rx="2" fill="#f6cd39"/>
  <circle cx="144" cy="153" r="8" fill="#7a4a30"/>
  <path d="M196 156h34" stroke="#fff" stroke-width="6"/>
  <path d="M196 156h34" stroke="#dfe5ef" stroke-width="3"/>
  <path d="M238 158v-12" stroke="#173ad3" stroke-width="7"/>

  <!-- Bulles -->
  <g class="b1">
    <path d="M176 14h44q9 0 9 9v20q0 9-9 9h-20l-12 12 2-12h-14q-9 0-9-9V23q0-9 9-9z" fill="#173ad3" transform="matrix(-1 0 0 1 408 0)"/>
    <text x="205" y="44" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">?</text>
  </g>
  <g class="b2">
    <path d="M136 16h52q9 0 9 9v18q0 9-9 9h-44l-16 12 4-12q-5-1-5-9V25q0-9 9-9z" fill="#fff" stroke="#dfe5ef" stroke-width="2"/>
    <path d="M144 28h36M144 40h24" stroke="#173ad3" stroke-width="4"/>
  </g>
</g>
</svg>
