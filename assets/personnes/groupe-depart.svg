@keyframes wave{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
@keyframes lift{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
