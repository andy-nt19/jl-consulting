<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.e2{animation-delay:1.7s}.e3{animation-delay:3.1s}
.wave{transform-origin:90px 100px;animation:wave 2.6s ease-in-out infinite}
.lift{transform-origin:262px 100px;animation:lift 3.4s ease-in-out infinite}
